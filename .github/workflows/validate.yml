name: validate

# Runs on every pull request and on every push to the default branch.
# This is the gate: a PR that breaks the schema, duplicates a package, cites a
# global app as local, or marks an entry verified without a country-scoped store
# earns a red check and cannot merge.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Validate catalog (schema, duplicates, package ids, conflicts)
        run: npm run validate

      - name: Check that built bundles are reproducible
        # Bundles are derived from the data and a pinned clock, never from the
        # wall clock, so two builds of the same commit must be byte-identical -
        # including manifest.json and SHA256SUMS. The clock is pinned to this
        # commit so the check also exercises the generated_at path.
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) npm run build
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) node tools/build/cli.mjs --out dist-check --validate --quiet
          if ! diff -r dist dist-check; then
            echo "::error::the build is not reproducible: two builds of this commit differ"
            exit 1
          fi
          echo "reproducible: dist and dist-check are byte-identical"

  store-check:
    # Best-effort liveness of the store listings a `verified` entry cites.
    # This job is intentionally NOT required: runners live in datacenters, and
    # many country-scoped stores (Café Bazaar, Myket, RuStore) throttle or block
    # such traffic. An inconclusive check must never fail a contributor's PR, so
    # the validator warns instead of erroring and this job tolerates exit 2.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: npm ci

      - name: Store availability (warnings are not failures)
        run: |
          set +e
          # --silent is load-bearing: plain `npm run` prints its "$ package"
          # banner to *stdout*, which would land in store-check.json and leave
          # the summary step below parsing a file that is not JSON.
          npm run --silent validate:stores -- --json --quiet > store-check.json
          status=$?
          cat store-check.json
          # 0 = every listing resolved; 2 = some were inconclusive (throttled).
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            echo "::error::store check failed with exit $status (expected 0 or 2)"
            exit "$status"
          fi
          echo "store check exit $status (inconclusive results are reported as warnings)"

      - name: Summarize
        if: always()
        run: |
          if [ -f store-check.json ]; then
            node -e '
              let r;
              try {
                r = JSON.parse(require("fs").readFileSync("store-check.json","utf8"));
              } catch (err) {
                // A summary is a nicety; never let it be the thing that fails
                // the job. An unparsable file means the capture is broken.
                console.log(`::warning::store-check.json is not JSON (${err.message}); see the store check step log`);
                process.exit(0);
              }
              const lines = [
                "### Store availability (best effort)",
                "",
                `- errors: ${r.errors ?? 0}`,
                `- warnings: ${r.warnings ?? 0}`,
                `- inconclusive: ${r.store_inconclusive ? "yes" : "no"}`,
                "",
                "> An inconclusive result means the runner could not reach the store",
                "> from a datacenter IP. It is not evidence that an app is unavailable.",
              ];
              require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            '
          fi
