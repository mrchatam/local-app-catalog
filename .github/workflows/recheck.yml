name: nightly-recheck

# Re-checks every `verified` entry against the country-scoped store that vouched
# for it, and demotes the ones that are provably gone.
#
# Design rule: a demotion requires a *definite* answer. Errors (blocked, rate
# limited, soft-404) are inconclusive and never demote. So a throttled runner
# produces chatter-free nights, and a real takedown produces exactly one PR.
#
# Demotion is `verified` -> `legacy`: the row is kept, the package stays in the
# repo and in history, but consumers stop treating it as local.
on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC daily, off the hour
  workflow_dispatch:
    inputs:
      apply:
        description: "Write demotions and open a PR (otherwise dry run)"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nightly-recheck
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: npm ci

      - name: Recheck verified entries
        id: recheck
        run: |
          set +e
          node tools/recheck/cli.mjs --json --quiet > recheck.json
          status=$?
          set -e
          # 0 = nothing to do, 1 = demotions pending (or the safety cap tripped),
          # 2 = nothing to demote but some entries could not be re-verified.
          # Only 1 means "there is a diff to open a PR for".
          echo "exit=$status"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat recheck.json
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ] && [ "$status" -ne 2 ]; then
            echo "::error::recheck failed with exit $status"
            exit "$status"
          fi

      - name: Report inconclusive entries
        run: |
          node -e '
            let r;
            try {
              r = JSON.parse(require("fs").readFileSync("recheck.json","utf8"));
            } catch (err) {
              console.log(`::warning::recheck.json is not JSON (${err.message}); see the recheck step log`);
              process.exit(0);
            }
            if (!r.inconclusive_count) process.exit(0);
            const lines = [
              "### " + r.inconclusive_count + " entr(ies) could not be re-verified",
              "",
              "The runner could not reach the store (throttled/blocked). No action taken;",
              "these are retried on the next nightly run.",
            ];
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '

      - name: Apply demotions
        if: steps.recheck.outputs.status == '1'
        # Apply exactly the findings the report above announced. Running the
        # probe a second time would re-ask every store: a throttled retry could
        # then apply a different (or empty) set than the PR describes, while
        # the PR title still quoted the first run.
        run: node tools/recheck/cli.mjs --apply --quiet --plan recheck.json

      - name: Re-validate the demoted tree
        if: steps.recheck.outputs.status == '1'
        run: |
          npm test
          npm run validate

      # Committing, pushing and opening the PR is one script rather than inline
      # shell: it is the part that regressed (a fresh checkout has no
      # remote-tracking ref for the nightly branch, so --force-with-lease failed
      # with "stale info" on a same-day re-run), and tests/recheck-pr.test.mjs
      # drives it against a real bare remote.
      - name: Open or update the demotion PR
        if: steps.recheck.outputs.status == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node tools/recheck/open-pr.mjs \
            --branch "nightly/recheck-$(date -u +%Y-%m-%d)" \
            --base "$GITHUB_REF_NAME" \
            --report recheck.json
