name: release

# Publishing a release is a deliberate act: push a tag like v2026.10.07.
# The tag names the dataset version, and the bundles it publishes are derived
# from the data alone (no wall clock), so anyone can rebuild the exact bytes
# from the tagged commit and get identical checksums.
on:
  push:
    tags:
      - "v20*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v2026.10.07"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Gate on tests and validation
        run: |
          npm test
          npm run validate

      - name: Determine tag
        id: tag
        env:
          # A dispatch input is a string a maintainer typed. Interpolating it
          # into a `run:` block with ${{ }} would let it execute as shell, so it
          # only ever arrives as an environment variable.
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "::error::tag must look like vYYYY.MM.DD, got '$tag'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publishing $tag"

      - name: Pin the build clock to the commit
        id: clock
        run: echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - name: Build checksummed bundles
        env:
          # Reproducible-builds convention: the timestamp in manifest.json comes
          # from the commit, not from when the runner happened to execute.
          SOURCE_DATE_EPOCH: ${{ steps.clock.outputs.epoch }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: npm run --silent build -- --tag "$TAG" --validate

      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          printf '%s\n' \
            'Per-country bundles and a combined catalog, with SHA-256 checksums.' \
            '' \
            '**Consumers:** fetch `catalog-<cc>.json` for the country you need, or' \
            '`catalog-all.json` for everything. Verify the download against' \
            '`SHA256SUMS` (`sha256sum -c SHA256SUMS`). Pin a tag to freeze the' \
            'dataset version; the `format` field in each bundle is the wire format.' \
            '' \
            'Rows with `confidence: "legacy"` are kept for history but are excluded' \
            'from the `packages` map - do not re-enable them.' \
            '' \
            'Data is ODbL. Tooling is MIT.' > /tmp/notes.md
          # --verify-tag: publishing must not be able to invent a tag. Without
          # it, a dispatch whose tag is mistyped would create that tag at the
          # current default branch and ship a release for a commit nobody chose.
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "$TAG" \
            --notes-file /tmp/notes.md
