name: release

# Publishing a release is a deliberate act: push a tag like v2026.10.07.
# The tag names the dataset version, and the bundles it publishes are derived
# from the data alone (no wall clock), so anyone can rebuild the exact bytes
# from the tagged commit and get identical checksums.
on:
  push:
    tags:
      - "v20*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v2026.10.07"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Gate on tests and validation
        run: |
          npm test
          npm run validate

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build checksummed bundles
        run: npm run build -- --tag "${{ steps.tag.outputs.tag }}" --validate

      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          printf '%s\n' \
            'Per-country bundles and a combined catalog, with SHA-256 checksums.' \
            '' \
            '**Consumers:** fetch `catalog-<cc>.json` for the country you need, or' \
            '`catalog-all.json` for everything. Verify the download against' \
            '`SHA256SUMS` (`sha256sum -c SHA256SUMS`). Pin a tag to freeze the' \
            'dataset version; the `format` field in each bundle is the wire format.' \
            '' \
            'Rows with `confidence: "legacy"` are kept for history but are excluded' \
            'from the `packages` map - do not re-enable them.' \
            '' \
            'Data is ODbL. Tooling is MIT.' > /tmp/notes.md
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --notes-file /tmp/notes.md
